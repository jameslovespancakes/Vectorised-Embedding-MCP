[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vectorise-mcp"
version = "0.8.2"
description = "Local stdio MCP server that turns folders of dense documents into a vector embedding DB Claude can search."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vectorise-mcp" }]
keywords = ["mcp", "claude", "rag", "embeddings", "vector-search", "sqlite-vec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mcp>=1.2.0",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
ocr = [
    "rapidocr-onnxruntime>=1.3.0",
    "pypdfium2>=4.20.0",
    "Pillow>=10.0.0",
]
notify = [
    "plyer>=2.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
vectorise-mcp = "vectorise_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/jameslovespancakes/Vectorised-Embedding-MCP"
Issues = "https://github.com/jameslovespancakes/Vectorised-Embedding-MCP/issues"
Source = "https://github.com/jameslovespancakes/Vectorised-Embedding-MCP"

[tool.hatch.build.targets.wheel]
packages = ["vectorise_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
